<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07141d"><title>Earth Can’t Answer Yet · Mission Control Jr.</title><link rel="stylesheet" href="./expansion.css"></head>
<body><div id="world" aria-label="Three-dimensional Meridian service bay"></div>
<header><div><small>MISSION CONTROL JR. / MERIDIAN · SOL 35</small><h1>Earth Can’t Answer Yet</h1></div><div class="header-actions"><button id="pause">Pause</button><button id="journey">Journey</button></div></header>
<main id="hud"><section class="panel metrics" aria-label="Mission resources"><div><span>Energy</span><strong id="energy">—</strong></div><div><span>Air reserve</span><strong id="air">—</strong></div><div><span>Earth reply</span><strong id="exposure">—</strong></div><p id="clock"></p></section>
<section class="panel task"><p class="eyebrow">CURRENT TASK</p><h2 id="objective">Loading mission…</h2><p id="notice" role="status" aria-live="polite"></p><div id="station-actions"></div></section>
<section class="panel locations"><p class="eyebrow">WALK TO A STATION</p><div id="locations"></div><p>WASD or arrow keys to walk · drag to look · E to use nearby equipment</p></section></main>
<div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="card"><p class="eyebrow" id="dialog-label">MERIDIAN TRAINING / SOL 35</p><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions"></div></div></div>
<script type="module" src="./missions/earth-delay/ui.js"></script></body></html>
