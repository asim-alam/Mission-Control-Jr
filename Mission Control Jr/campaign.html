<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c98a5a" />
    <title>Mission Control Jr. — Thirty Sols</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./hud-redesign.css" />
  <link rel="stylesheet" href="./kid-theme.css"></head>
  <body>
    <div id="game-container" aria-hidden="true"></div>
    <div id="ui">
      <button id="mute" aria-label="Mute audio" aria-pressed="false">🔊</button>
      <div id="title" class="panel center">
        <h1>MISSION CONTROL JR.</h1>
        <h3>Base Boss · 30 Days at Meridian</h3>
        <p>Four astronauts. 30 days on Mars. Each day you pick the crew's job, and sometimes something surprising happens. Watch the power, air, water, food, machines and how happy the crew is. Think ahead!</p>
        <button id="start">Start!</button>
      </div>
      <div id="hud" hidden>
        <div id="left" class="panel"><div id="sol"></div><div id="resources"></div></div>
        <div id="right" class="panel"><div id="crew"></div><div id="log" aria-live="polite"></div></div>
        <div id="work" class="panel"></div>
      </div>
      <div id="modal" class="ui-scrim" role="dialog" aria-modal="true" aria-labelledby="modal-heading" hidden>
        <div class="panel center ui-card"><div id="modal-body"></div><div id="modal-buttons" class="ui-actions"></div></div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
