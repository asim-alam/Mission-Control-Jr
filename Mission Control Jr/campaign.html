<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c98a5a" />
    <title>Mission Control Jr. — Thirty Sols</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./hud-redesign.css" />
  <link rel="stylesheet" href="./kid-theme.css"></head>
  <body>
    <div id="game-container" aria-hidden="true"></div>
    <div id="ui">
      <div class="campaign-controls"><button id="view" type="button" hidden>Third person</button><button id="mute" aria-label="Mute audio" aria-pressed="false">🔊</button></div>
      <div id="title" class="panel center">
        <h1>MISSION CONTROL JR.</h1>
        <h3>Thirty Sols at Meridian</h3>
        <p>Lead four astronauts through 30 days on Mars. Choose one crew job each day, respond to surprises, and keep the base and crew healthy.</p>
        <button id="start">Start!</button>
      </div>
      <div id="hud" hidden>
        <div id="left" class="panel"><div id="sol"></div><div id="resources"></div><div id="campaign-guidance" class="mission-guidance mission-guidance-tools" hidden></div></div>
        <div id="right" class="panel"><div id="crew"></div><div id="log" aria-live="polite"></div></div>
        <div id="work" class="panel"></div>
      </div>
      <div id="modal" class="ui-scrim" role="dialog" aria-modal="true" aria-labelledby="modal-heading" hidden>
        <div class="panel center ui-card"><div id="modal-body"></div><div id="modal-buttons" class="ui-actions"></div></div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
